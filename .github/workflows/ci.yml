name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Pipenv
        run: |
          python -m pip install --upgrade pipenv
          pipenv install --dev --deploy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify project version metadata
        run: pipenv run version --verify

      - name: Build solution
        run: pipenv run build

      - name: Run tests
        run: pipenv run test

      - name: Build ZIP, Python, and Node.js packages
        run: pipenv run archive --all

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: crt-cpp-app-packages
          path: |
            dist/*.zip
            dist/*.whl
            dist/*.nupkg
            dist/*.tgz
          if-no-files-found: error
