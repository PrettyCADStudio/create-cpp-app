name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
          - platform: Linux
            runner: ubuntu-latest
          - platform: macOS
            runner: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build release packages
        run: python archive.py --zip --python --nodejs

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: crt-cpp-app-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.whl
            dist/*.tgz
          if-no-files-found: error

  publish-nuget:
    name: Publish NuGet package
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(dotnet msbuild src/crt-cpp-app/crt-cpp-app.csproj -nologo -getProperty:Version)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $package_version."
            exit 1
          fi

      - name: Pack NuGet tool
        run: dotnet pack src/crt-cpp-app/crt-cpp-app.csproj --configuration Release --output dist

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: crt-cpp-app-nuget
          path: dist/*.nupkg
          if-no-files-found: error

      - name: Publish NuGet package
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Repository secret NUGET_API_KEY is required to publish to nuget.org."
            exit 1
          fi
          dotnet nuget push "dist/*.nupkg" --api-key "$NUGET_API_KEY" --source "https://api.nuget.org/v3/index.json" --skip-duplicate

  release:
    name: Publish release
    needs: [build, publish-nuget]
    runs-on: ubuntu-latest

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: crt-cpp-app-*
          merge-multiple: true
          path: dist

      - name: Create release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.whl
            dist/*.nupkg
            dist/*.tgz
