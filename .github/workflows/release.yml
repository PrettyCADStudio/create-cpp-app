name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
          - platform: Linux
            runner: ubuntu-latest
          - platform: macOS
            runner: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build release packages
        run: python archive.py --zip --python --nodejs

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: crt-cpp-app-release-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.whl
            dist/*.tgz
          if-no-files-found: error

      - name: Upload Python package
        uses: actions/upload-artifact@v4
        with:
          name: crt-cpp-app-python-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload Node.js package
        uses: actions/upload-artifact@v4
        with:
          name: crt-cpp-app-nodejs-${{ matrix.platform }}
          path: dist/*.tgz
          if-no-files-found: error

  publish-nuget:
    name: Publish NuGet package
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(dotnet msbuild src/crt-cpp-app/crt-cpp-app.csproj -nologo -getProperty:Version)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $package_version."
            exit 1
          fi

      - name: Pack NuGet tool
        run: dotnet pack src/crt-cpp-app/crt-cpp-app.csproj --configuration Release --output dist

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: crt-cpp-app-nuget
          path: dist/*.nupkg
          if-no-files-found: error

      - name: Publish NuGet package
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Repository secret NUGET_API_KEY is required to publish to nuget.org."
            exit 1
          fi
          dotnet nuget push "dist/*.nupkg" --api-key "$NUGET_API_KEY" --source "https://api.nuget.org/v3/index.json" --skip-duplicate

  publish-pypi:
    name: Publish Python packages
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches Python package version
        shell: bash
        run: |
          package_version="$(python setup.py --version)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Python package version $package_version."
            exit 1
          fi

      - name: Download Python packages
        uses: actions/download-artifact@v4
        with:
          pattern: crt-cpp-app-python-*
          merge-multiple: true
          path: dist

      - name: Verify PyPI token
        shell: bash
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "::error::Repository secret PYPI_API_TOKEN is required to publish to PyPI."
            exit 1
          fi

      - name: Publish Python packages to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
          skip-existing: true

  publish-npm:
    name: Publish Node.js packages
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download Node.js packages
        uses: actions/download-artifact@v4
        with:
          pattern: crt-cpp-app-nodejs-*
          merge-multiple: true
          path: dist

      - name: Verify npm token
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Repository secret NPM_TOKEN is required to publish to npm."
            exit 1
          fi

      - name: Verify and publish Node.js packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          shopt -s nullglob
          packages=(dist/*.tgz)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::No Node.js packages were downloaded."
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          for package in "${packages[@]}"; do
            read -r package_name package_version < <(
              tar -xOf "$package" package/package.json |
                node -e 'const pkg = JSON.parse(require("node:fs").readFileSync(0, "utf8")); console.log(`${pkg.name} ${pkg.version}`);'
            )
            if [ "$package_version" != "$tag_version" ]; then
              echo "::error::Package $package_name has version $package_version, but tag $GITHUB_REF_NAME was pushed."
              exit 1
            fi
            if npm view "$package_name@$package_version" version --registry "https://registry.npmjs.org" >/dev/null 2>&1; then
              echo "$package_name@$package_version is already published; skipping."
              continue
            fi
            npm publish "./$package" --access public --registry "https://registry.npmjs.org"
          done

  release:
    name: Publish release
    needs: [build, publish-nuget, publish-pypi, publish-npm]
    runs-on: ubuntu-latest

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: crt-cpp-app-release-*
          merge-multiple: true
          path: dist

      - name: Download NuGet package
        uses: actions/download-artifact@v4
        with:
          name: crt-cpp-app-nuget
          path: dist

      - name: Create release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.whl
            dist/*.nupkg
            dist/*.tgz
